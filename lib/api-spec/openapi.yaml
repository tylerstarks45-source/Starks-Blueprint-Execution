      operationId: getBlueprintCategory
      tags: [blueprint-categories]
      summary: Get a blueprint category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Blueprint category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintCategory"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBlueprintCategory
      tags: [blueprint-categories]
      summary: Update a blueprint category
      parameters:
