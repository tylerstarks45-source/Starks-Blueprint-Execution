openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SBEP — Starks Blueprint Execution Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: blueprint-categories
    description: Blueprint category management
  - name: blueprints
    description: Blueprint registry
  - name: blueprint-steps
    description: Blueprint step management
  - name: tool-categories
    description: Tool category management
  - name: tools
    description: Tool registry
  - name: affiliate-links
    description: Affiliate link management
  - name: users
    description: User management
  - name: system-instances
    description: System instance tracking
  - name: build-sessions
    description: Build session management
  - name: build-progress
    description: Build progress tracking
  - name: build-outputs
    description: Build output management
  - name: user-memory
    description: User memory/state persistence
  - name: user-credentials
    description: User credential storage
  - name: openrouter
    description: OpenRouter AI integration
  - name: admin
    description: Admin control center
  - name: notifications
    description: Notification management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Blueprint Categories ──────────────────────────────────────────────────
  /blueprint-categories:
    get:
      operationId: listBlueprintCategories
      tags: [blueprint-categories]
      summary: List all blueprint categories
