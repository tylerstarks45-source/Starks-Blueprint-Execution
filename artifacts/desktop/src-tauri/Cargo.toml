[package]
name = "starks-desktop"
version = "0.1.0"
description = "Lightweight desktop shell for Starks Global Group"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "starks-desktop"
path = "src/main.rs"
