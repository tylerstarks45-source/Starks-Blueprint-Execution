    AffiliateLink:
      type: object
      properties:
        id:
          type: integer
        toolId:
          type: ["integer", "null"]
        url:
          type: string
        campaign:
          type: ["string", "null"]
        clickCount:
          type: integer
        active:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, url, clickCount, active, createdAt, updatedAt]

    AffiliateLinkInput:
      type: object
      properties:
        toolId:
          type: integer
        url:
          type: string
          minLength: 1
        campaign:
          type: string
        active:
          type: boolean
      required: [url]

