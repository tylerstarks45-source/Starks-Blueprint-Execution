components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── Blueprint Categories ────────────────────────────────────────────────
    BlueprintCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, createdAt, updatedAt]

    BlueprintCategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required: [name]

    BlueprintCategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    # ── Blueprints ──────────────────────────────────────────────────────────
    Blueprint:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        categoryId:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]
        difficulty:
          type: string
        estimatedCost:
          type: ["string", "null"]
        estimatedTime:
          type: ["string", "null"]
        status:
          type: string
        version:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, slug, name, difficulty, status, version, createdAt, updatedAt]

    BlueprintInput:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        categoryId:
          type: integer
        description:
          type: string
        difficulty:
          type: string
        estimatedCost:
          type: string
        estimatedTime:
          type: string
        status:
          type: string
        version:
          type: string
      required: [slug, name]

    BlueprintUpdate:
      type: object
      properties:
        name:
          type: string
        categoryId:
          type: integer
        description:
          type: string
        difficulty:
          type: string
        estimatedCost:
          type: string
        estimatedTime:
          type: string
        status:
          type: string
        version:
          type: string

    # ── Blueprint Steps ─────────────────────────────────────────────────────
    BlueprintStep:
      type: object
      properties:
        id:
          type: integer
        blueprintId:
          type: integer
        stepNumber:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        actionType:
          type: string
        config:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, blueprintId, stepNumber, title, actionType, createdAt, updatedAt]

    BlueprintStepInput:
      type: object
      properties:
        stepNumber:
          type: integer
        title:
          type: string
          minLength: 1
        description:
          type: string
        actionType:
          type: string
        config:
          type: string
      required: [stepNumber, title]

    BlueprintStepUpdate:
      type: object
      properties:
        stepNumber:
          type: integer
        title:
          type: string
        description:
          type: string
        actionType:
          type: string
        config:
          type: string

    # ── Tool Categories ─────────────────────────────────────────────────────
    ToolCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, createdAt, updatedAt]

    ToolCategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required: [name]

    ToolCategoryUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    # ── Tools ───────────────────────────────────────────────────────────────
    Tool:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: ["integer", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        affiliateLink:
          type: ["string", "null"]
        signupUrl:
          type: ["string", "null"]
        pricing:
          type: ["string", "null"]
        requiredCredentials:
          type: ["array", "null"]
          items:
            type: string
        oauthRequired:
          type: boolean
        activeStatus:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, oauthRequired, activeStatus, createdAt, updatedAt]

    ToolInput:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
          minLength: 1
        description:
          type: string
        affiliateLink:
          type: string
        signupUrl:
          type: string
        pricing:
          type: string
        requiredCredentials:
          type: array
          items:
            type: string
        oauthRequired:
          type: boolean
        activeStatus:
          type: boolean
      required: [name]

    ToolUpdate:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: string
        affiliateLink:
          type: string
        signupUrl:
          type: string
        pricing:
          type: string
        requiredCredentials:
          type: array
          items:
            type: string
        oauthRequired:
          type: boolean
        activeStatus:
          type: boolean

