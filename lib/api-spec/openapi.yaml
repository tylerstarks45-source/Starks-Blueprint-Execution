    User:
      type: object
      properties:
        id:
          type: integer
        externalId:
          type: ["string", "null"]
        email:
          type: string
        name:
          type: ["string", "null"]
        membershipStatus:
          type: string
        membershipTier:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        creditsBalance:
          type: integer
        active:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, email, membershipStatus, active, createdAt, updatedAt]

