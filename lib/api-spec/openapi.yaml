        membershipStatus:
          type: string
        membershipTier:
          type: string
        active:
          type: boolean

    # ── System Instances ────────────────────────────────────────────────────
    SystemInstance:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        blueprintId:
          type: integer
        name:
          type: string
        buildStatus:
          type: string
        healthStatus:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, userId, blueprintId, name, buildStatus, healthStatus, createdAt, updatedAt]

    SystemInstanceInput:
      type: object
      properties:
        userId:
          type: integer
        blueprintId:
          type: integer
        name:
