          type: string

    # ── System Activity Events ──────────────────────────────────────────────
    SystemActivityEvent:
      type: object
      properties:
        id:
          type: integer
        systemInstanceId:
          type: integer
        eventType:
          type: string
        amountCents:
          type: ["integer", "null"]
        description:
          type: string
        metadata:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, systemInstanceId, eventType, description, createdAt]

    SystemActivityEventInput:
      type: object
      properties:
        eventType:
          type: string
        amountCents:
          type: integer
        description:
          type: string
          minLength: 1
