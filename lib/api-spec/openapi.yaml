        "200":
          description: List of blueprint categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlueprintCategory"
    post:
      operationId: createBlueprintCategory
      tags: [blueprint-categories]
      summary: Create a blueprint category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintCategory"

  /blueprint-categories/{id}:
