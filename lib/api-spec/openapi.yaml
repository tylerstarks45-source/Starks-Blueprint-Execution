        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /approvals/{id}/reject:
    post:
      operationId: rejectPendingApproval
      tags: [approvals]
      summary: Reject a pending approval item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /approvals/{id}/revert:
    post:
      operationId: revertPendingApproval
      tags: [approvals]
      summary: Reverse a previously-approved, executed action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "400":
          description: Not reversible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ─── M-12: Build 043–045A route coverage ─────────────────────────────────────
# These paths were added in Builds 043–045A (DOL, Connections Hub, Certification,
# Launch Hardening). All are mounted under /api via the servers.url prefix.
# Admin-only endpoints are marked with x-admin-only: true for tooling.

  # ── Build 046: Unified Platform Operating System ────────────────────────────
  /platform/workspaces:
    post:
      operationId: createPlatformWorkspace
      tags: [platform]
      summary: Create a new platform workspace for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceName: { type: string, maxLength: 200 }
                workspaceType: { type: string, enum: [personal, team, organization] }
                configuration: { type: object, additionalProperties: true }
              required: [workspaceName]
      responses:
        "200":
          description: Created workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  workspace: { type: object, additionalProperties: true }
                required: [success, workspace]

  /platform/projects:
    post:
      operationId: createPlatformProject
      tags: [platform]
      summary: Create a new platform project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId: { type: integer }
                appId:       { type: string }
                projectName: { type: string, maxLength: 200 }
                projectType: { type: string, enum: [website, crm, automation, dashboard, custom] }
                metadata:    { type: object, additionalProperties: true }
              required: [projectName, projectType]
      responses:
        "200":
          description: Created project
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  project: { type: object, additionalProperties: true }
                required: [success, project]

  /platform/applications:
    get:
      operationId: listPlatformApplications
      tags: [platform]
      summary: List all registered platform applications
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  applications: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, applications, count]
    post:
      operationId: registerPlatformApplication
      tags: [platform]
      summary: Register a new application in UPOS (admin only)
      x-admin-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appId:       { type: string }
                appName:     { type: string }
                appDomain:   { type: string }
                version:     { type: string }
                description: { type: string }
              required: [appId, appName, appDomain]
      responses:
        "200":
          description: Registered application
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  app: { type: object, additionalProperties: true }
                required: [success, app]

  /platform/commands:
    get:
      operationId: listPlatformCommands
      tags: [platform]
      summary: List all active platform commands; optionally filter by appId
      parameters:
        - name: appId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Command list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  commands: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, commands, count]
    post:
      operationId: registerPlatformCommands
      tags: [platform]
      summary: Register commands for an application (admin only)
      x-admin-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appId:    { type: string }
                commands: { type: array, items: { type: object, additionalProperties: true }, minItems: 1 }
              required: [appId, commands]
      responses:
        "200":
          description: Registration result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:    { type: boolean }
                  registered: { type: integer }
                required: [success, registered]

  /platform/runtime:
    get:
      operationId: getPlatformRuntime
      tags: [platform]
      summary: Get the authenticated user's UPOS runtime state
      responses:
        "200":
          description: Runtime state and active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:      { type: boolean }
                  runtime:      { type: object, additionalProperties: true }
                  sessions:     { type: array, items: { type: object, additionalProperties: true } }
                  sessionCount: { type: integer }
                required: [success, runtime, sessions, sessionCount]

  /platform/context:
    get:
      operationId: getPlatformContext
      tags: [platform]
      summary: Get the user's current UPOS navigation context (ASH always has access to this)
      responses:
        "200":
          description: Current context
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  context: { type: object, additionalProperties: true }
                required: [success]
    patch:
      operationId: updatePlatformContext
      tags: [platform]
      summary: Update the user's current context (called by each page as it loads)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPage:        { type: string }
                currentAppId:       { type: string }
                currentProjectId:   { type: integer }
                currentWorkspaceId: { type: integer }
                currentOrgId:       { type: integer }
                permissions:        { type: array, items: { type: string } }
      responses:
        "200":
          description: Updated context
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  context: { type: object, additionalProperties: true }
                required: [success, context]

  /platform/search:
    get:
      operationId: getPlatformSearch
      tags: [platform]
      summary: Global unified search across apps, commands, projects, and workspaces
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Search query
        - name: kinds
          in: query
          schema: { type: string }
          description: Comma-separated list of result kinds (application,command,project,workspace)
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  results: { type: array, items: { type: object, additionalProperties: true } }
                  count:   { type: integer }
                required: [success, results, count]

  /platform/activity:
    get:
      operationId: getPlatformActivity
      tags: [platform]
      summary: Get the authenticated user's platform activity timeline
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Activity timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:  { type: boolean }
                  activity: { type: array, items: { type: object, additionalProperties: true } }
                  count:    { type: integer }
                required: [success, activity, count]

  /platform/registry:
    get:
      operationId: getPlatformRegistry
      tags: [platform]
      summary: Get the platform application registry
      responses:
        "200":
          description: Application registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:  { type: boolean }
                  registry: { type: array, items: { type: object, additionalProperties: true } }
                  count:    { type: integer }
                required: [success, registry, count]

  /platform/snapshots:
    get:
      operationId: getPlatformSnapshots
      tags: [platform]
      summary: Get platform runtime snapshots (admin only)
      x-admin-only: true
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Platform snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:   { type: boolean }
                  snapshots: { type: array, items: { type: object, additionalProperties: true } }
                  count:     { type: integer }
                required: [success, snapshots, count]

  # ── Build 043: Digital Operating Layer ──────────────────────────────────────
  /operating/status:
    get:
      operationId: getOperatingLayerStatus
      tags: [operating]
      summary: Get current Digital Operating Layer status (admin only)
      x-admin-only: true
      responses:
        "200":
          description: Operating layer status snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  snapshot: { type: object, additionalProperties: true }
                required: [success]

  /operating/sessions:
    get:
      operationId: listOperatingSessions
      tags: [operating]
      summary: List DOL execution sessions for the authenticated user
      responses:
        "200":
          description: List of execution sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  sessions: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, sessions, count]

  # ── Build 044: Unified Connections & Integration Hub ─────────────────────────
  /connections/providers:
    get:
      operationId: listConnectionProviders
      tags: [connections]
      summary: List all known integration providers
      parameters:
        - name: domain
          in: query
          schema: { type: string }
          description: Filter by connection domain (e.g. ai, database, social)
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  providers: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, providers, count]

  /connections/capabilities:
    get:
      operationId: listConnectionCapabilities
      tags: [connections]
      summary: List provider capabilities; optionally filter by capability name
      parameters:
        - name: providerId
          in: query
          schema: { type: integer }
        - name: capability
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Capability list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  capabilities: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, capabilities, count]

  /connections/registry:
    get:
      operationId: getConnectionRegistry
      tags: [connections]
      summary: Get the full connection registry ordered by domain
      responses:
        "200":
          description: Connection registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  registry: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, registry, count]

  /connections/register:
    post:
      operationId: registerConnectionProvider
      tags: [connections]
      summary: Register a new integration provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                providerName: { type: string }
                domain: { type: string }
                providerType: { type: string }
                baseUrl: { type: string, format: uri }
                version: { type: string }
              required: [providerName, domain, providerType]
      responses:
        "200":
          description: Registered provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  provider: { type: object, additionalProperties: true }
                required: [success, provider]

  /connections/discover:
    post:
      operationId: discoverConnections
      tags: [connections]
      summary: Trigger full provider catalog seeding and capability discovery (admin only)
      x-admin-only: true
      responses:
        "200":
          description: Discovery result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]

  /connections/snapshots:
    get:
      operationId: getConnectionSnapshots
      tags: [connections]
      summary: List connection hub snapshots (admin only)
      x-admin-only: true
      responses:
        "200":
          description: Snapshot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  snapshots: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, snapshots, count]

  /connections/audit:
    get:
      operationId: getConnectionAudit
      tags: [connections]
      summary: Get connection hub audit log (admin only)
      x-admin-only: true
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  audit: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, audit, count]

  # ── Build 045: Cognitive Certification & Launch Readiness ────────────────────
  /certification/run:
    post:
      operationId: runCertification
      tags: [certification]
      summary: Trigger a full certification run (admin only)
      x-admin-only: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                runName: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Certification run result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  runId: { type: integer }
                  summary: { type: object, additionalProperties: true }
                  adminPackage: { type: object, additionalProperties: true }
                required: [success, runId]
        "429":
          description: Rate limited — too many runs in the last 10 minutes

  /certification/results:
    get:
      operationId: getCertificationResults
      tags: [certification]
      summary: List the last 10 certification runs (admin only)
      x-admin-only: true
      responses:
        "200":
          description: Certification run list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  runs: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, runs, count]

  /certification/launch-report:
    post:
      operationId: getCertificationLaunchReport
      tags: [certification]
      summary: Generate a launch readiness report (admin only)
      x-admin-only: true
      responses:
        "200":
          description: Launch readiness report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  launchReadiness: { type: object, additionalProperties: true }
                  adminPackage: { type: object, additionalProperties: true }
                required: [success, launchReadiness]

  /certification/revalidate:
    post:
      operationId: revalidateCertification
      tags: [certification]
      summary: Re-run architecture validation (admin only)
      x-admin-only: true
      responses:
        "200":
          description: Revalidation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  domainCount: { type: integer }
                  passed: { type: integer }
                  failed: { type: integer }
                required: [success]

  # ── Build 045A: Launch Hardening Framework ───────────────────────────────────
  /launch-hardening/status:
    get:
      operationId: getLaunchHardeningStatus
      tags: [launch-hardening]
      summary: Get overall launch hardening status (admin only)
      x-admin-only: true
      responses:
        "200":
          description: Launch hardening status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  status: { type: string }
                  blockersRemaining: { type: integer }
                  preLaunchRemaining: { type: integer }
                required: [success, status]

  /launch-hardening/findings:
    get:
      operationId: getLaunchFindings
      tags: [launch-hardening]
      summary: List all launch findings (admin only)
      x-admin-only: true
      parameters:
        - name: priority
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Launch findings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  findings: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, findings, count]

  /launch-hardening/blockers:
    get:
      operationId: getLaunchBlockers
      tags: [launch-hardening]
      summary: List open BLOCKER findings (admin only)
      x-admin-only: true
      responses:
        "200":
          description: Open blockers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  blockers: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, blockers, count]

  /launch-hardening/snapshots:
    get:
      operationId: getLaunchHardeningSnapshots
      tags: [launch-hardening]
      summary: List launch hardening snapshots (admin only)
      x-admin-only: true
      responses:
        "200":
          description: Snapshot history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  snapshots: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                required: [success, snapshots, count]

components:
  parameters:
    BusinessId:
      name: id
      in: path
      required: true
      description: Business id
      schema:
        type: integer

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            required: [error]

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── Blueprint Categories ────────────────────────────────────────────────
    BlueprintCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, createdAt, updatedAt]

    BlueprintCategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required: [name]

    BlueprintCategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    # ── Blueprints ──────────────────────────────────────────────────────────
    Blueprint:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        categoryId:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]
        difficulty:
          type: string
        estimatedCost:
          type: ["string", "null"]
        estimatedTime:
          type: ["string", "null"]
        status:
          type: string
        version:
          type: string
        authorUserId:
          type: ["integer", "null"]
        priceCredits:
          type: integer
        source:
          type: string
        reviewStatus:
          type: string
        salesCount:
          type: integer
        ratingAvg:
          type: number
        ratingCount:
          type: integer
        rejectionReason:
          type: ["string", "null"]
        estimatedEarnings:
          type: ["string", "null"]
        requiredTools:
          type: ["string", "null"]
        setupSteps:
          type: ["string", "null"]
        avgEarningsCents:
          type: integer
          description: Average lifetime earnings in cents across all deployed system instances of this blueprint.
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, slug, name, difficulty, status, version, priceCredits, source, reviewStatus, salesCount, ratingAvg, ratingCount, createdAt, updatedAt]

    BlueprintInput:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        categoryId:
          type: integer
        description:
          type: string
        difficulty:
          type: string
        estimatedCost:
          type: string
        estimatedTime:
          type: string
        status:
          type: string
        version:
          type: string
      required: [slug, name]

    BlueprintUpdate:
      type: object
      properties:
        name:
          type: string
        categoryId:
          type: integer
        description:
          type: string
        difficulty:
          type: string
        estimatedCost:
          type: string
        estimatedTime:
          type: string
        status:
          type: string
        version:
          type: string

    BlueprintSubmitInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        categoryId:
          type: integer
        difficulty:
          type: string
        estimatedCost:
          type: string
        estimatedTime:
          type: string
        estimatedEarnings:
          type: string
        requiredTools:
          type: string
        setupSteps:
          type: string
        priceCredits:
          type: integer
      required: [name]

    BlueprintReviewInput:
      type: object
      properties:
        rating:
          type: integer
        reviewText:
          type: string
      required: [rating]

    BlueprintReviewStatusInput:
      type: object
      properties:
        reviewStatus:
          type: string
        rejectionReason:
          type: string
      required: [reviewStatus]

    BlueprintReview:
      type: object
      properties:
        id:
          type: integer
        blueprintId:
          type: integer
        userId:
          type: integer
        rating:
          type: integer
        reviewText:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, blueprintId, userId, rating, createdAt]

    BlueprintPurchase:
      type: object
      properties:
        id:
          type: integer
        blueprintId:
          type: integer
        buyerUserId:
          type: integer
        authorUserId:
          type: ["integer", "null"]
        priceCredits:
          type: integer
        creatorShareCredits:
          type: integer
        createdAt:
          type: string
      required: [id, blueprintId, buyerUserId, priceCredits, creatorShareCredits, createdAt]

    # ── Blueprint Steps ─────────────────────────────────────────────────────
    BlueprintStep:
      type: object
      properties:
        id:
          type: integer
        blueprintId:
          type: integer
        stepNumber:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        actionType:
          type: string
        config:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, blueprintId, stepNumber, title, actionType, createdAt, updatedAt]

    BlueprintStepInput:
      type: object
      properties:
        stepNumber:
