<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0F1A" />
    <title>Starks Global Group — Offline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f1a;
        color: #f5f7fb;
        font-family: "Outfit", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 12px;
      }
      p {
        color: #9aa4b8;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      button {
        background: #f5f7fb;
        color: #0b0f1a;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Starks Global Group needs an internet connection to load. Reconnect
        and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
